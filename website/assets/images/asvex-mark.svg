<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 166" width="100%" height="100%">
  <defs>
    <linearGradient id="mark_aGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#051030"/>
    </linearGradient>
    <linearGradient id="mark_cbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0044CC"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <linearGradient id="mark_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0055FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00CFFF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="mark_shine" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0A2040"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
    <filter id="mark_strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mark_softGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mark_shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#00AAFF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel -->
  <rect x="2" y="6" width="154" height="154" rx="24" fill="none" stroke="#00AAFF" stroke-width="3" opacity="0.12"/>
  <rect x="6" y="10" width="148" height="148" rx="20" fill="url(#mark_shine)"/>
  <!-- Grid -->
  <line x1="28" y1="10" x2="28" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="46" y1="10" x2="46" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="64" y1="10" x2="64" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="82" y1="10" x2="82" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="100" y1="10" x2="100" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="118" y1="10" x2="118" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="136" y1="10" x2="136" y2="158" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="28" x2="154" y2="28" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="46" x2="154" y2="46" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="64" x2="154" y2="64" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="82" x2="154" y2="82" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="100" x2="154" y2="100" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="118" x2="154" y2="118" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="6" y1="136" x2="154" y2="136" stroke="#1040A0" stroke-width="0.5" opacity="0.25"/>
  <!-- Border + top highlight -->
  <rect x="6" y="10" width="148" height="148" rx="20" fill="none" stroke="url(#mark_borderGrad)" stroke-width="1.5"/>
  <line x1="26" y1="10" x2="134" y2="10" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>

  <!-- A legs -->
  <polygon points="33,136 53,136 77,54 68,26 59,54" fill="url(#mark_aGrad)" filter="url(#mark_shadow)"/>
  <polygon points="124,136 104,136 80,54 68,26 77,54" fill="url(#mark_aGrad)"/>
  <!-- Bevel -->
  <polygon points="59,54 68,26 71,34 64,54" fill="#00D4FF" opacity="0.18"/>
  <polygon points="77,54 68,26 65,34 72,54" fill="#00D4FF" opacity="0.10"/>

  <!-- Crossbar -->
  <rect x="52" y="86" width="54" height="11" rx="3" fill="url(#mark_cbGrad)" filter="url(#mark_softGlow)" opacity="0.95"/>
  <rect x="52" y="89" width="54" height="2" rx="1" fill="#A0F0FF" opacity="0.5"/>
  <!-- Nodes -->
  <circle cx="52" cy="91" r="5.5" fill="#00CFFF" filter="url(#mark_strongGlow)"/>
  <circle cx="52" cy="91" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="106" cy="91" r="5.5" fill="#00CFFF" filter="url(#mark_strongGlow)"/>
  <circle cx="106" cy="91" r="2.5" fill="white" opacity="0.9"/>
  <!-- Traces -->
  <line x1="20" y1="91" x2="46" y2="91" stroke="#00CFFF" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="20" cy="91" r="2" fill="#0055FF" opacity="0.6"/>
  <rect x="14" y="88" width="6" height="6" rx="1" fill="none" stroke="#0077FF" stroke-width="0.8" opacity="0.5"/>
  <line x1="110" y1="91" x2="142" y2="91" stroke="#00CFFF" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="142" cy="91" r="2" fill="#0055FF" opacity="0.6"/>
  <rect x="142" y="88" width="6" height="6" rx="1" fill="none" stroke="#0077FF" stroke-width="0.8" opacity="0.5"/>

  <!-- Apex -->
  <polygon points="68,12 77,26 68,34 59,26" fill="#00E5FF" filter="url(#mark_strongGlow)" opacity="0.95"/>
  <polygon points="68,16 74,26 68,30 62,26" fill="white" opacity="0.95"/>
  <circle cx="68" cy="26" r="2" fill="white" opacity="0.8"/>
  <line x1="68" y1="6" x2="68" y2="12" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
  <circle cx="68" cy="6" r="2.5" fill="#00E5FF" opacity="0.5" filter="url(#mark_strongGlow)"/>

  <!-- Bottom traces -->
  <line x1="33" y1="136" x2="14" y2="136" stroke="#0055FF" stroke-width="1" opacity="0.45"/>
  <line x1="14" y1="136" x2="14" y2="152" stroke="#0055FF" stroke-width="1" opacity="0.45"/>
  <circle cx="14" cy="152" r="2.5" fill="#0055FF" opacity="0.5"/>
  <circle cx="14" cy="152" r="1" fill="#00CFFF" opacity="0.8"/>
  <line x1="124" y1="136" x2="144" y2="136" stroke="#0055FF" stroke-width="1" opacity="0.45"/>
  <line x1="144" y1="136" x2="144" y2="152" stroke="#0055FF" stroke-width="1" opacity="0.45"/>
  <circle cx="144" cy="152" r="2.5" fill="#0055FF" opacity="0.5"/>
  <circle cx="144" cy="152" r="1" fill="#00CFFF" opacity="0.8"/>
</svg>
